<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7B2FF7">
  <title>You're offline | FitTrack Pro</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #FF6B35 0%, #F72585 55%, #7B2FF7 100%);
      color: #fff; text-align: center; padding: 1.5rem;
    }
    .box { background: rgba(255, 255, 255, .15); border-radius: 24px; padding: 2.5rem 2rem; max-width: 420px; }
    .bolt { font-size: 4rem; }
    h1 { margin: .5rem 0; }
    p { opacity: .95; line-height: 1.5; }
    button {
      margin-top: 1rem; background: #fff; color: #F72585; border: 0; border-radius: 50px;
      padding: .75rem 2rem; font-weight: 700; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="bolt">⚡</div>
    <h1>You're offline</h1>
    <p>FitTrack Pro needs an internet connection to load your latest data. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
