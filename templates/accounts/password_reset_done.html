{% extends 'base.html' %}
{% block title %}Check your email | FitTrack Pro{% endblock %}

{% block content %}
<div class="container auth-wrapper">
  <div class="auth-card text-center">
    <div class="icon-bubble grad-teal mx-auto"><i class="bi bi-envelope-check-fill"></i></div>
    <h3 class="fw-bold">Check your email</h3>
    <p class="text-muted">If an account with that email exists, we've sent a link to reset the password.</p>
    <a href="{% url 'login' %}" class="btn btn-fit">Back to login</a>
  </div>
</div>
{% endblock %}
